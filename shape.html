<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="canonical" href="/browse/">
<meta http-equiv="refresh" content="0; url=/browse/">
<title>Redirecting…</title>
</head>
<body>
<p>This page moved to <a href="/browse/">/browse/</a>.</p>
<script>
  var id = new URLSearchParams(location.search).get('id');
  location.replace(id ? '/shapes/' + encodeURIComponent(id) + '/' : '/browse/');
</script>
</body>
</html>
