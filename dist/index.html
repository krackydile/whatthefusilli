.eyebrow {

.mood-label { color: var(--ink-soft); font-size: .95rem; margin: 0; }

}

.big-btn {

}

.big-btn:hover { filter: brightness(1.07); transform: translateY(-1px); }
.big-btn:active { transform: translateY(1px); }

.result {
  margin: 26px auto 24px;

  overflow: hidden;

}

.result.show { display: block; animation: rise .35s ease both; }

@keyframes rise {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: none; }
}

.result-top {
  display: flex;
  gap: 26px;
  align-items: center;
  padding: 30px;
  background: var(--bg-alt);
  border-bottom: 1px solid var(--line);

.pron { color: var(--ink-soft); font-style: italic; font-size: .95rem; }

.result-body { padding: 26px 30px 30px; }

.spinner-note { color: var(--ink-soft); font-size: .9rem; margin-top: 18px; min-height: 1.2em; }

.meta {

.tagline { color: var(--ink-soft); margin-top: 8px; }

.badges { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 14px; }

.badge {

  padding: 4px 11px;
  border-radius: 999px;
  background: var(--accent-soft);

.badge.plain { background: transparent; border-color: var(--line); color: var(--ink-soft); }

.cols {

}

.panel {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 22px 24px;
  margin-bottom: 18px;
}

.panel h2 { font-size: 1.15rem; margin-bottom: 10px; }
.panel p { margin: 0 0 12px; }
.panel p:last-child { margin-bottom: 0; }

.diefact {
  border-left: 3px solid var(--gold);
  padding-left: 14px;
  color: var(--ink-soft);
  font-size: .93rem;
}

.fact {
  background: var(--bg-alt);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 20px 24px;
  font-family: var(--serif);
  font-size: 1.02rem;
}

.backlink {
  display: inline-block;
  margin: 24px 0 0;
  color: var(--ink-soft);
  text-decoration: none;
  font-size: .9rem;
}

.backlink:hover { color: var(--accent); }

footer.site {
  border-top: 1px solid var(--line);
  padding: 28px 0 40px;
  color: var(--ink-soft);
  font-size: .85rem;
  text-align: center;

.empty { color: var(--ink-soft); padding: 40px 0; text-align: center; }

/* extrusion diagram */
.extrude-fig { width: 100%; max-width: 340px; margin: 6px auto 0; display: block; }

/* accessibility */
a:focus-visible,
button:focus-visible,
input:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 4px;
}

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .01ms !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;

// SVG illustrations for each pasta shape. viewBox is always 0 0 100 100.
// Colours come from CSS vars so they adapt to light/dark.

const F = 'var(--pasta-fill)';
const L = 'var(--pasta-line)';

function helix(cx, top, bottom, w, turns) {
  const step = (bottom - top) / turns;
  let d = '';
  for (let i = 0; i < turns; i++) {
    const y = top + i * step;
    d += `M${cx - w} ${y} C${cx - w} ${y + step * 0.55} ${cx + w} ${y + step * 0.45} ${cx + w} ${y + step} `;
  }
  return d;
}

// A filled ribbon built from two wave edges.
function band(y, h, amp) {
  let top = `M0 ${y} `;
  for (let x = 0; x < 100; x += 50) {
    top += `Q${x + 12.5} ${y - amp} ${x + 25} ${y} Q${x + 37.5} ${y + amp} ${x + 50} ${y} `;
  }
  let bot = '';
  for (let x = 100; x > 0; x -= 50) {
    bot += `Q${x - 12.5} ${y + h + amp} ${x - 25} ${y + h} Q${x - 37.5} ${y + h - amp} ${x - 50} ${y + h} `;
  }
  return `<path d="${top} L100 ${y + h} ${bot} Z" fill="${F}" stroke="${L}" stroke-width="1.6" stroke-linejoin="round"/>`;
}

function tube(x, y, w, h, ridges, tilt) {
  const rx = w / 2;
  const ry = w * 0.22;
  let g = `<g transform="rotate(${tilt || 0} ${x + rx} ${y + h / 2})">`;
  g += `<path d="M${x} ${y} L${x} ${y + h} A${rx} ${ry} 0 0 0 ${x + w} ${y + h} L${x + w} ${y} Z" fill="${F}" stroke="${L}" stroke-width="1.6"/>`;
  if (ridges) {
    for (let i = 1; i < 4; i++) {
      const px = x + (w / 4) * i;
      g += `<line x1="${px}" y1="${y + 3}" x2="${px}" y2="${y + h - 2}" stroke="${L}" stroke-width="1" opacity=".55"/>`;
    }
  }
  g += `<ellipse cx="${x + rx}" cy="${y}" rx="${rx}" ry="${ry}" fill="var(--pasta-hole)" stroke="${L}" stroke-width="1.6"/>`;
  g += `</g>`;
  return g;
}

function rod(x, w, top, bottom, hollow) {
  let s = `<rect x="${x}" y="${top}" width="${w}" height="${bottom - top}" rx="${Math.min(w / 2, 3)}" fill="${F}" stroke="${L}" stroke-width="1.3"/>`;
  if (hollow) {
    s += `<rect x="${x + w * 0.32}" y="${top}" width="${w * 0.36}" height="${bottom - top}" fill="var(--pasta-hole)" stroke="${L}" stroke-width=".9"/>`;
    s += `<ellipse cx="${x + w / 2}" cy="${top + 2}" rx="${w / 2}" ry="${w * 0.32}" fill="${F}" stroke="${L}" stroke-width="1.2"/>`;
    s += `<ellipse cx="${x + w / 2}" cy="${top + 2}" rx="${w * 0.18}" ry="${w * 0.12}" fill="var(--pasta-hole)" stroke="${L}" stroke-width=".9"/>`;
  }
  return s;
}

// A quill: cylinder with a mouth cut on the bias.
function quill(ridged) {
  const ridges = ridged
    ? [1, 2, 3, 4].map(i => {
        const x = 28 + 8.8 * i;
        const top = 22 + ((x - 28) / 44) * 16;
        return `<line x1="${x}" y1="${top + 4}" x2="${x}" y2="${80 - Math.abs(i - 2.5) * 1.2}" stroke="${L}" stroke-width="1" opacity=".45"/>`;
      }).join('')
    : '';
  return `<g transform="rotate(-22 50 52)">
    <path d="M28 22 L28 78 A22 7 0 0 0 72 78 L72 38 Z" fill="${F}" stroke="${L}" stroke-width="1.7"/>
    ${ridges}
    <ellipse cx="50" cy="30" rx="23.4" ry="7" transform="rotate(20 50 30)" fill="var(--pasta-hole)" stroke="${L}" stroke-width="1.7"/>
  </g>`;
}

// A ribbon with scalloped edges down both long sides.
function frilledBand(y, h) {
  let d = `M4 ${y} `;
  for (let x = 4; x < 96; x += 8) d += `A4 4 0 0 1 ${x + 8} ${y} `;
  d += `L96 ${y + h} `;
  for (let x = 96; x > 4; x -= 8) d += `A4 4 0 0 1 ${x - 8} ${y + h} `;
  return `<path d="${d} Z" fill="${F}" stroke="${L}" stroke-width="1.5"/>`;
}

function pastaSVG(type, cls) {
  const draw = ICONS[type] || ICONS.strand;
  return `<svg class="${cls || 'pasta-art'}" viewBox="0 0 100 100" role="img" aria-hidden="true">${draw()}</svg>`;
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    <div><dt>Family</dt><dd>${CATEGORIES[p.cat].label}</dd></div>

/* ---------------- decider ---------------- */

function gcd(a, b) { while (b) { const t = b; b = a % b; a = t; } return a; }

/* The pasta of the day. Everyone gets the same shape on the same date, and it
   holds all day no matter how often you reload.

   Stepping through the list by a number coprime with its length visits every
   shape exactly once before any repeat — so the site works through all 49 over
   49 days rather than showing the same one twice in a week, which is what a
   plain hash-the-date would do. */
function pastaOfTheDay(list, when) {
  const d = when || new Date();
  const day = Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000);
  const n = list.length;
  const step = [23, 17, 13, 11, 29, 31, 37, 41, 43, 47, 1].find(k => gcd(k, n) === 1);
  return list[((day * step) % n + n) % n];
}

/* The shape is fixed for the day; the greeting isn't. This changes on every
   load so the page has something new even when the pasta doesn't. */
const HEADLINES = [
  "What's boiling today?",
  'Put the water on.',
  'Stop scrolling. Start boiling.',
  'The semolina has spoken.',
  'Salt the water.',
  'The pot has spoken.',
  'Water you waiting for?',
  "Let's get this pot started.",
  'Salt it like the sea.',
  'Bring it to a rolling boil.',
  'Feeling saucy?',
  'Use your noodle.',
  'Al dente or nothing.',
  'Boil now, thank me later.',
  'Water first. Questions later.',
  'Steam ahead.'
];

function initDecider() {
  const wrap = document.getElementById('sauceFilters');
  const note = document.getElementById('note');
  const result = document.getElementById('result');
  const headline = document.getElementById('headline');
  const chosen = new Set();
  const todays = pastaOfTheDay(PASTA);
  let showing = null;

  if (headline) {
    headline.textContent = HEADLINES[Math.floor(Math.random() * HEADLINES.length)];
  }

  wrap.innerHTML = Object.entries(SAUCE_TAGS)
    .map(([k, v]) => `<button class="chip" data-tag="${k}" aria-pressed="false">${esc(v)}</button>`)
    .join('');

  wrap.addEventListener('click', e => {
    const btn = e.target.closest('.chip');
    if (!btn) return;
    const tag = btn.dataset.tag;
    if (chosen.has(tag)) { chosen.delete(tag); btn.setAttribute('aria-pressed', 'false'); }
    else { chosen.add(tag); btn.setAttribute('aria-pressed', 'true'); }
    updateNote();
    show(randomFrom(pool()), false, false);
  });

  function pool() {
    if (!chosen.size) return PASTA;
    return PASTA.filter(p => [...chosen].some(t => p.sauces.includes(t)));
  }

  function updateNote() {
    const n = pool().length;
    note.textContent = chosen.size
      ? `${n} shape${n === 1 ? '' : 's'} match what you're after.`
      : '';
  }

  function randomFrom(list) {
    let candidates = list;
    if (list.length > 1 && showing) {
      const without = list.filter(p => p.id !== showing.id);
      if (without.length) candidates = without;
    }
    return candidates[Math.floor(Math.random() * candidates.length)];
  }

  function backToToday() {
    chosen.clear();
    wrap.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', 'false'));
    updateNote();
    show(todays, true, false);
  }

  function show(p, isToday, scroll) {
    if (!p) { result.innerHTML = ''; result.classList.remove('show'); return; }
    showing = p;

    const dateLabel = new Date().toLocaleDateString(undefined,
      { weekday: 'long', day: 'numeric', month: 'long' });

    result.classList.remove('show');
    result.innerHTML = `
      <div class="result-top">
        <div class="art">${pastaSVG(p.icon)}</div>
        <div>
          <p class="eyebrow">${isToday ? esc(dateLabel) : 'Just browsing'}</p>
          <h2 class="shape-name">${esc(p.name)}</h2>
          <p class="pron">${esc(p.pron)} · ${esc(p.meaning)}</p>
        </div>
      </div>
      <div class="result-body">
        ${metaRow(p)}
        <p><strong>Serve it with:</strong> ${esc(p.best)}</p>
        <p style="margin-top:18px">
          <a href="${shapeHref(p.id)}">Read how ${esc(p.name.split(' /')[0])} is made →</a>
        </p>
        ${isToday ? '' : `<p style="margin-top:10px">
          <a href="#" id="back-to-today">← Back to today's pasta</a>
        </p>`}
      </div>`;
    void result.offsetWidth;
    result.classList.add('show');

    const back = document.getElementById('back-to-today');
    if (back) back.addEventListener('click', e => { e.preventDefault(); backToToday(); });

    if (scroll) result.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  document.getElementById('spin').addEventListener('click', () => show(randomFrom(pool()), false, true));
  show(todays, true, false);
}

/* ---------------- browse ---------------- */

function initBrowse() {
  const filters = document.getElementById('catFilters');
  const out = document.getElementById('results');
  const search = document.getElementById('search');
  let cat = 'all';

  filters.innerHTML = `<button class="chip" data-cat="all" aria-pressed="true">All</button>` +
    Object.entries(CATEGORIES).map(([k, v]) =>
      `<button class="chip" data-cat="${k}" aria-pressed="false">${esc(v.label)}</button>`).join('');

  filters.addEventListener('click', e => {
    const btn = e.target.closest('.chip');
    if (!btn) return;
    cat = btn.dataset.cat;
    filters.querySelectorAll('.chip').forEach(c =>
      c.setAttribute('aria-pressed', String(c === btn)));
    render();
  });

  search.addEventListener('input', render);

  function card(p) {
    return `<a class="card" href="${shapeHref(p.id)}">
      <div class="art">${pastaSVG(p.icon)}</div>
      <h3>${esc(p.name)}</h3>
      <p class="sub">${esc(p.pron)}</p>
    </a>`;
  }

  function render() {
    const q = search.value.trim().toLowerCase();
    let list = PASTA;
    if (cat !== 'all') list = list.filter(p => p.cat === cat);
    if (q) {
      list = list.filter(p =>
        [p.name, p.pron, p.region, p.meaning, p.best, p.made, p.die,
          CATEGORIES[p.cat].label, METHODS[p.method],
          ...p.sauces.map(s => SAUCE_TAGS[s])
        ].join(' ').toLowerCase().includes(q));
    }

    if (!list.length) {
      out.innerHTML = `<p class="empty">No shapes match that. Try “tube”, “Sicily”, or “pesto”.</p>`;
      return;
    }

    const groups = Object.keys(CATEGORIES)
      .map(k => [k, list.filter(p => p.cat === k)])
      .filter(([, items]) => items.length);

    out.innerHTML = groups.map(([k, items]) => `
      <section class="cat-block">
        <header>
          <h2>${esc(CATEGORIES[k].label)}</h2>
          <p>${esc(CATEGORIES[k].blurb)}</p>
        </header>
        <div class="grid">${items.map(card).join('')}</div>
      </section>`).join('');
  }

  render();
}

    <rect x="10" y="34" width="200" height="62" rx="10" fill="var(--bg-alt)" stroke="var(--line)" stroke-width="2"/>
    <path d="M30 46 q14 19 0 38 M56 46 q14 19 0 38 M82 46 q14 19 0 38 M108 46 q14 19 0 38 M134 46 q14 19 0 38 M160 46 q14 19 0 38"
          fill="none" stroke="var(--pasta-line)" stroke-width="3" opacity=".55"/>
    <line x1="20" y1="65" x2="190" y2="65" stroke="var(--pasta-line)" stroke-width="4" opacity=".8"/>
    <rect x="210" y="24" width="16" height="82" rx="4" fill="var(--accent)" opacity=".85"/>
    <g fill="var(--pasta-fill)" stroke="var(--pasta-line)" stroke-width="1.5">
      <rect x="226" y="44" width="104" height="7" rx="3.5"/>
      <rect x="226" y="61" width="104" height="7" rx="3.5"/>
      <rect x="226" y="78" width="104" height="7" rx="3.5"/>
    </g>
    <text x="105" y="118" text-anchor="middle" font-size="11" fill="var(--ink-soft)" font-family="sans-serif">auger under pressure</text>
    <text x="218" y="18" text-anchor="middle" font-size="11" fill="var(--accent)" font-family="sans-serif">die</text>
    <text x="278" y="118" text-anchor="middle" font-size="11" fill="var(--ink-soft)" font-family="sans-serif">cut &amp; dried</text>
  </svg>`;
}

const EXTRUSION_101 = `A pasta factory is essentially one long screw. Semolina and water are mixed
  into a dough far drier than bread dough — crumbly, not smooth — and an auger drives it forward under
  roughly 100 bar of pressure into a bronze or Teflon plate called a <em>trafila</em>, the die. The shape
  of the holes in that plate is the shape of the pasta. A blade spinning against the face of the die cuts
  the emerging dough to length. Bronze dies drag on the dough and leave a chalky, porous surface that
  grips sauce; Teflon dies are slicker, faster and cheaper, and give the glossy pasta that sauce slides off.
  Everything after that is drying — slowly at low heat for good pasta, fast and hot for cheap pasta.`;

function initDetail(pastaId) {
  const id = pastaId || new URLSearchParams(location.search).get('id');
  const p = PASTA.find(x => x.id === id);
  const root = document.getElementById('detail');

  if (!p) {
    root.innerHTML = `<p class="empty">That shape isn't in the catalogue. <a href="${browseHref}">Browse them all →</a></p>`;
    return;
  }

  document.title = p.name + ' — What The Fusilli';

  const related = PASTA.filter(x => x.cat === p.cat && x.id !== p.id).slice(0, 4);

  root.innerHTML = `
    <div class="detail-head">
      <div class="art">${pastaSVG(p.icon)}</div>
      <div class="titles">
        <p class="eyebrow">${esc(CATEGORIES[p.cat].label)}</p>
        <h1>${esc(p.name)}</h1>
        <p class="pron">${esc(p.pron)}</p>
        <p class="tagline">${esc(p.meaning)}</p>
        <div class="badges">
          <span class="badge">${METHODS[p.method]}</span>
          ${p.sauces.map(s => `<span class="badge plain">${esc(SAUCE_TAGS[s])}</span>`).join('')}
        </div>
      </div>
    </div>

    <div class="cols">
      <div>
        <div class="panel">
          <h2>How it's made</h2>
          <p>${p.made}</p>
          <p class="diefact"><strong>The die:</strong> ${esc(p.die)}</p>
        </div>

        ${p.method === 'extruded' ? `
        <div class="panel">
          <h2>Extrusion, in short</h2>
          <p>${EXTRUSION_101}</p>
          ${extruderDiagram()}
        </div>` : `
        <div class="panel">
          <h2>Why this one isn't extruded</h2>
          <p>Most dried pasta is pushed through a die under pressure. ${esc(p.name.split(' /')[0])} isn't —
          the shape can't be produced by forcing dough through a hole, so it's ${p.method === 'rolled'
            ? 'laminated into a sheet and cut'
            : p.method === 'stamped'
              ? 'built from sheets, filled and sealed'
              : 'formed piece by piece by hand'}. That means softer egg or water dough, a shorter
          cook time, and a texture no extruder can reproduce.</p>
          ${extruderDiagram()}
        </div>`}

        <div class="fact">${p.fact}</div>
      </div>

      <aside>
        <div class="panel">
          <h2>At a glance</h2>
          ${metaRow(p)}
        </div>
        <div class="panel">
          <h2>Serve it with</h2>
          <p>${esc(p.best)}</p>
        </div>
        ${related.length ? `
        <div class="panel">
          <h2>Also in this family</h2>
          ${related.map(r => `<p style="margin:0 0 8px"><a href="${shapeHref(r.id)}">${esc(r.name)}</a></p>`).join('')}
        </div>` : ''}
        <a class="backlink" href="${browseHref}">← All shapes</a>
      </aside>
    </div>`;
}


const VIEWS = {"decide":"\n  <section class=\"hero\">\n    <p class=\"eyebrow\">Pasta of the day</p>\n    <h1 id=\"headline\">What's boiling today?</h1>\n  </section>\n\n  <article class=\"result\" id=\"result\"></article>\n\n  <div class=\"reroll\">\n    <button class=\"big-btn\" id=\"spin\">\n      <svg width=\"19\" height=\"19\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M21 12a9 9 0 1 1-3-6.7\"/><path d=\"M21 3v6h-6\"/></svg>\n      Not feeling it? Show me another\n    </button>\n    <p class=\"spinner-note\" id=\"note\"></p>\n  </div>\n\n  <section class=\"mood\">\n    <p class=\"mood-label\">Or go looking — what are you in the mood for?</p>\n    <div class=\"filters\" id=\"sauceFilters\"></div>\n  </section>\n","browse":"\n  <div class=\"browse-head\">\n    <p class=\"eyebrow\">The catalogue</p>\n    <h1>Every shape</h1>\n    <p class=\"lede\">Grouped by family. Click any shape for its name, region, sauce pairings and how it's actually made.</p>\n  </div>\n\n  <div class=\"toolbar\">\n    <label class=\"sr-only\" for=\"search\">Search shapes</label>\n    <input class=\"search\" id=\"search\" type=\"search\" placeholder=\"Search a name, region or sauce…\" autocomplete=\"off\">\n    <div class=\"filters\" id=\"catFilters\" style=\"margin:0;justify-content:flex-start\"></div>\n  </div>\n\n  <div id=\"results\"></div>\n","shape":"<div id=\"detail\"></div>"};
const appEl = document.getElementById('app');
const footEl = document.getElementById('foot');

function router() {
  const hash = location.hash.slice(1);
  const isShape = hash.startsWith('shape/');
  const view = isShape ? 'shape' : (hash === 'browse' ? 'browse' : 'decide');

  appEl.innerHTML = VIEWS[view];
  document.title = 'What The Fusilli';

  if (view === 'shape') { initDetail(decodeURIComponent(hash.split('/')[1] || '')); }
  else if (view === 'browse') { initBrowse(); }
  else { initDecider(); }

  footEl.innerHTML = view === 'shape'
    ? '<a href="#browse">← Back to all shapes</a>'
    : (view === 'browse'
        ? PASTA.length + ' shapes catalogued.'
        : 'Shapes, regions and die notes for ' + PASTA.length +
          ' pastas. Cook times are for dried unless noted.');

  document.querySelectorAll('nav.site a').forEach(a => {
    a.classList.toggle('active', a.dataset.route === (isShape ? 'browse' : view));
  });

  window.scrollTo(0, 0);
}

addEventListener('hashchange', router);
router();
</script>
