  <section class="mood">
    <p class="mood-label">Or steer it — what are you in the mood for?</p>
    <div class="filters" id="sauceFilters"></div>
  </section>
</main>

<footer class="site">
  <div class="wrap">Shapes, regions and die notes for 49 pastas. Cook times are for dried unless noted.</div>
